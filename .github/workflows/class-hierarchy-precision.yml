name: Targeted CLASS hierarchy convergence
on:
  push:
    branches: [main]
    paths:
      - 'cosmology/class_hierarchy_precision.py'
      - '.github/workflows/class-hierarchy-precision.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hierarchy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - run: python -m pip install "classy==3.4.3.0" "numpy>=1.26,<3" "scipy>=1.11,<2"
      - run: |
          mkdir -p outputs
          python kinetics/energy_closed_bath.py --n 480 --kappa .1383 --relaxation 100 --rtol 5e-7 --keep-psd --output outputs/energy480.json
          python cosmology/class_hierarchy_precision.py --input outputs/energy480.json --output outputs/hierarchy.json
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: targeted-class-hierarchy
          path: outputs/*.json
          retention-days: 21
