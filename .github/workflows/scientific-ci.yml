name: Scientific verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  theory-smoke:
    name: Python ${{ matrix.python-version }} scientific regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - name: Check out source without storing credentials
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install scientific dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26,<3" "scipy>=1.11,<2" "mpmath>=1.3,<2" "pytest>=8,<10"
      - name: Validate theory numerics and source syntax
        run: python -m pytest -q tests
      - name: Run original synthetic SPARC likelihood checks
        run: PYTHONPATH=code python -m unittest discover -s code -p 'test_*.py' -v
