name: Weekly deep theoretical numerics

on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 0'

permissions:
  contents: read

jobs:
  deep-numerics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out reproducible research
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Python 3.13
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install "numpy>=1.26,<3" "scipy>=1.11,<2" "mpmath>=1.3,<2"
      - name: Compute entire cutoff hierarchy and critical approach
        run: |
          mkdir -p outputs
          python continuation-05/reproduce_cutoff_ladder.py > outputs/01_cutoff_ladder.json
          python continuation-05/critical_limit.py > outputs/02_critical_limit.json
      - name: Independently check critical equilibrium and virial
        run: |
          python continuation-04/code/critical_lowered.py > outputs/03_critical_lowered.json
          python continuation-04/code/lowered_virial.py > outputs/04_virial.json
      - name: Check kinetic escape toy and energy shell geometry
        run: |
          python continuation-05/reproduce_open_flux.py > outputs/05_open_flux.json
          python continuation-06/code/phase_density_edge.py > outputs/06_escape_density_of_states.json
          python continuation-06/code/dos_scaling.py > outputs/07_universal_state_density.json
      - name: Verify each output is valid JSON with numerical assertions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          names=sorted(Path('outputs').glob('*.json'))
          assert len(names)==7, names
          for name in names:
              data=json.loads(name.read_text())
              assert isinstance(data,dict) and data, name
              print(name, "OK",len(name.read_bytes()),"bytes")
          PY
      - name: Preserve numerical output as downloadable artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dark-matter-theory-numerics
          path: outputs/*.json
          retention-days: 14
          if-no-files-found: error
