name: Five-population quantum kinetic focused gate

on:
  push:
    branches: [research/kinetic-equilibrium-audit-20261121]
    paths:
      - "kinetics/phi_bose_five_dirac_full_yukawa_implicit.py"
      - "kinetics/phi_bose_five_dirac_kl_certificate.py"
      - "kinetics/phi_bose_critical_ir_susceptibility.py"
      - "tests/test_phi_bose_critical_ir_susceptibility.py"
      - "tests/test_phi_bose_five_dirac_ir_composite.py"
      - "tests/test_phi_bose_five_dirac_strong_convergence_audit.py"
      - "kinetics/phi_bose_five_dirac_strong_convergence_audit.py"
      - "tests/test_phi_bose_five_dirac_full_yukawa_implicit.py"
      - "tests/test_phi_bose_five_dirac_kl_certificate.py"
      - ".github/workflows/research-fivefield.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  five-field-focused:
    name: Five physical populations / physical U1-energy-KL regression
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - name: Install scientific dependencies
        run: python -m pip install "numpy>=1.26,<3" "scipy>=1.11,<2" "mpmath>=1.3,<2" "pytest>=8,<10"
      - name: Validate actual all-channel strong roots and independent entropy
        run: OPENBLAS_NUM_THREADS=1 python -m pytest -q -s tests/test_phi_bose_five_dirac_full_yukawa_implicit.py tests/test_phi_bose_five_dirac_kl_certificate.py tests/test_phi_bose_critical_ir_susceptibility.py tests/test_phi_bose_five_dirac_ir_composite.py tests/test_phi_bose_five_dirac_strong_convergence_audit.py
